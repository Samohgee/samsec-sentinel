<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SAMSEC Sentinel AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="page-shell auth-shell">
        <div class="glass-card auth-card">
            <p class="eyebrow">Secure sign in</p>
            <h1>Welcome back.</h1>
            <p class="hero-text">Use your workspace credentials to access your security dashboard.</p>
            <form class="auth-actions">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@company.com">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="••••••••">
                </div>
                <button class="button button-primary" type="submit">Sign in</button>
            </form>
            <div class="social-row">
                <a href="#">Google</a>
                <a href="#">GitHub</a>
                <a href="#">Microsoft</a>
            </div>
            <p style="margin-top:1rem;color:var(--muted);"><a href="register.html">Need an account?</a></p>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
