<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | SAMSEC Sentinel AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="page-shell auth-shell">
        <div class="glass-card auth-card">
            <p class="eyebrow">Create workspace</p>
            <h1>Start your secure journey.</h1>
            <p class="hero-text">Set up your team, unlock AI recommendations, and monitor your digital perimeter.</p>
            <form class="auth-actions">
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" type="text" placeholder="Alex Rivera">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="you@company.com">
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Create a strong password">
                </div>
                <button class="button button-primary" type="submit">Create account</button>
            </form>
            <p style="margin-top:1rem;color:var(--muted);"><a href="login.html">Already have an account?</a></p>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
